[project]
name = "transitlive"
version = "0.1.0"
description = "Collector, archive and API for BC Transit live data in the Sea-to-Sky corridor"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE"]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "gtfs-realtime-bindings>=1.0",
  "httpx>=0.27",
  "protobuf>=5.27",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30",
  "zstandard>=0.23",
]

[project.scripts]
transitlive = "transitlive.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "testcontainers[postgres]>=4.8",
  "types-protobuf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitlive"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
packages = ["transitlive"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transitlive.domain.*", "transitlive.gtfs.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (a throwaway PostgreSQL container)"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`", "ignore:testcontainers.postgres is deprecated"]

[tool.coverage.run]
source = ["transitlive"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
