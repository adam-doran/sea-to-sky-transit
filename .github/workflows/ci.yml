name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
      - run: make setup
      - run: make lint
      - run: make test

  integration:
    name: Integration tests (PostgreSQL in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
      - run: make setup
      - run: make test-integration

  image:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t sea-to-sky-transit-backend:ci .
      - run: docker run --rm sea-to-sky-transit-backend:ci --help
