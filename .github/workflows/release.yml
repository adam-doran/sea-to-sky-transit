name: Release

# Tag a version (git tag v0.1.0 && git push --tags) to publish images to
# GitHub Container Registry. Deploying is then a pull on the server; see docs/RUNBOOK.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sea-to-sky-transit-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sea-to-sky-transit-backend:latest

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sea-to-sky-transit-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sea-to-sky-transit-web:latest
